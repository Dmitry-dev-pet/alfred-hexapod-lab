name: Publish Stanford Pupper CPU replay to local tablet catalog
on:
  push:
    branches:
      - feature/android-local-offline-viewer-20261104
    paths:
      - .github/workflows/pupper-cpu-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-local-offline-viewer-20261104
          persist-credentials: true
      - name: Validate the original physics replay and publish catalog revision
        run: |
          python scripts/publish_pupper_cpu_viewer.py
          python -m json.tool docs/hexapod/library.json >/dev/null
          node --check docs/hexapod/pupper-stand-cpu-v1/app.js
      - name: Commit only catalog metadata, preserving all old routes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/hexapod/library.json
          if git diff --cached --quiet; then
            echo 'Pupper viewer already in catalog'
          else
            git commit -m "viewer: publish verified Stanford Pupper CPU stance (rev 27)"
            git push origin HEAD:feature/android-local-offline-viewer-20261104
          fi
