name: Render Hexapod demo GIF and MP4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/render-demo.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install renderer and video tools
        run: |
          python -m pip install -r runtime/requirements.txt
          if ! command -v xvfb-run >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri
          fi
      - name: Render physical simulation
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python scripts/render_video.py --seconds 6 --fps 15
          ffprobe -v error -show_entries format=duration,size -of json results/first_tripod_demo.mp4
      - name: Save preview into repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/first_tripod_demo.mp4 results/first_tripod_demo.gif
          git diff --cached --quiet || (git commit -m 'Render initial MuJoCo hexapod GIF and MP4 [skip ci]' && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: hexapod-first-tripod-preview
          path: |
            results/first_tripod_demo.gif
            results/first_tripod_demo.mp4
          retention-days: 30
