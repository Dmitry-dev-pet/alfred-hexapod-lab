name: SeBaJu pinned MuJoCo physical trials (M4 only)
on:
  push:
    branches:
      - research/sebaju-balance-jump-20261107
    paths:
      - research/sebaju/**
      - tests/test_sebaju_monitor.py
      - .github/workflows/sebaju-m4-physical.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    # No paid GitHub-hosted compute and no PR/fork trigger on self-hosted Mac.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent classification tests
        run: python3 -m unittest discover -s tests -p test_sebaju_monitor.py -v
      - name: Create isolated MuJoCo runtime
        run: |
          python3 -m venv .venv-sebaju
          .venv-sebaju/bin/python -m pip install --disable-pip-version-check 'mujoco==3.14.0'
      - name: Original SeBaJu 13 s jump (measured physical replay)
        run: |
          .venv-sebaju/bin/python research/sebaju/run_headless.py \
            --trial jump --duration 13 --out .cache/sebaju/jump
      - name: Original SeBaJu 18 s physical roll disturbance
        run: |
          .venv-sebaju/bin/python research/sebaju/run_headless.py \
            --trial tip --duration 18 --tip-start 12 --tip-seconds 0.15 \
            --tip-torque 8 --out .cache/sebaju/tip
      - name: Preserve actual receipts and traces even if an experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sebaju-m4-physical-trials
          path: .cache/sebaju/
          if-no-files-found: warn
          retention-days: 14
