name: Hexapod Python unit tests

on:
  pull_request:
    paths:
      - "hexlab/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "hexlab/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run no-dependency tests (v0.3 + v0.4)
        run: python -m unittest discover -s tests -v
