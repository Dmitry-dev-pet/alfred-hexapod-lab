name: Validate OEM Freenove geometry and render preview
on:
  push:
    branches:
      - experiment/freenove-oem-geometry-20261103
    paths:
      - .github/workflows/geometry-validation.yml
      - hexlab/**
      - models/**
      - tests/**
      - scripts/render_video.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MuJoCo and rendering dependencies
        shell: bash
        run: |
          python -m pip install -r runtime/requirements.txt
          if ! command -v xvfb-run >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dri
          fi
      - name: Regenerate and unit-test geometry (requires real MuJoCo)
        shell: bash
        run: |
          set -euo pipefail
          python -m hexlab.mujoco_model
          python -m unittest discover -s tests -v
      - name: Run short physical simulations
        shell: bash
        run: |
          python -m hexlab.mujoco_experiment --mode stand --seconds 2 --out results/mujoco_geometry_corrected_stand_2s.json
          python -m hexlab.mujoco_experiment --mode tripod --seconds 4 --out results/mujoco_geometry_corrected_tripod_4s.json
      - name: Render GIF and MP4
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' python scripts/render_video.py \
            --seconds 5 --fps 12 --width 600 --height 450 \
            --video results/oem_geometry_tripod_5s.mp4 --gif results/oem_geometry_tripod_5s.gif
          ffprobe -v error -show_entries format=duration,size -of json results/oem_geometry_tripod_5s.mp4
      - name: Commit reproducible preview to experiment branch
        if: github.ref == 'refs/heads/experiment/freenove-oem-geometry-20261103'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/oem_geometry_tripod_5s.gif results/oem_geometry_tripod_5s.mp4
          git diff --cached --quiet || (git commit -m 'Add geometry-corrected MuJoCo preview [skip ci]' && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: freenove-oem-geometry-preview
          path: |
            results/oem_geometry_tripod_5s.gif
            results/oem_geometry_tripod_5s.mp4
            results/mujoco_geometry_corrected_stand_2s.json
            results/mujoco_geometry_corrected_tripod_4s.json
          retention-days: 30
