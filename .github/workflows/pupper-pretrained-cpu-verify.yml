name: Verify Stanford pretrained Pupper CPU physics without training
on:
  push:
    branches:
      - research/pupper-cpu-no-training-20261107
    paths:
      - .github/workflows/pupper-pretrained-cpu-verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pupper-cpu-no-training-20261107
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reproducible CPU-only MuJoCo environment
        run: python -m pip install "mujoco==3.14.0" "numpy==2.3.5"
      - name: Verify original Stanford policy checksum and training-independent rollout
        run: |
          python -m unittest discover -s research/stanford_pupper -p 'test_pretrained_cpu.py' -v
          python research/stanford_pupper/infer_pupper.py --policy research/stanford_pupper/default_policy.json --duration 5 --vx 0.2 --delay 4 --output /tmp/pupper_pretrained_5s.json
          python research/stanford_pupper/export_pretrained_viewer.py --source /tmp/pupper_pretrained_5s.json --template research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json --output /tmp/pupper_pretrained_viewer.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('research/stanford_pupper')
          a=json.loads((root/'trial_5s.json').read_text())
          b=json.loads(Path('/tmp/pupper_pretrained_5s.json').read_text())
          assert a['summary']['physics_steps']==b['summary']['physics_steps']==1250
          assert abs(a['summary']['forward_dx_m']-b['summary']['forward_dx_m'])<0.01
          assert a['summary']['fall_guard_steps']==b['summary']['fall_guard_steps']==0
          assert len(a['frames'])==len(b['frames'])==250
          x=json.loads(Path('/tmp/pupper_pretrained_viewer.json').read_text())
          assert x['is_walk'] and len(x['frames'])==250 and len(x['visual_meshes'])==13
          print('STANFORD_PRETRAINED_CPU_VERIFIED',a['summary']['forward_dx_m'],b['summary']['forward_dx_m'])
          PY
