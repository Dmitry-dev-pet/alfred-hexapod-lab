name: Export Stanford Pupper measured CPU stance to viewer
on:
  push:
    branches:
      - research/pupper-cpu-no-training-20261107
    paths:
      - .github/workflows/pupper-cpu-export.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pupper-cpu-no-training-20261107
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU physics only (no GPU or training)
        run: python -m pip install 'mujoco==3.14.0' 'numpy>=1.26,<3'
      - name: Re-run original measured physics and export body-world FK
        run: |
          python research/stanford_pupper/reproduce_pupper.py --source-xml research/stanford_pupper/upstream/pupper_v3.xml --seconds 5 --output /tmp/stanford-pupper-stance-raw.json
          python research/stanford_pupper/export_pupper_stance_viewer.py --xml research/stanford_pupper/upstream/pupper_v3.xml --trace /tmp/stanford-pupper-stance-raw.json --output research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json
          python -m unittest discover -s research/stanford_pupper -p 'test_pupper_cpu.py' -v
          sha256sum research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json
          wc -c research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json
      - name: Commit exact recorded replay in the research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json
          if git diff --cached --quiet; then echo 'Same deterministic replay'; else
            git commit -m "research(pupper): store true 5s MuJoCo qpos/Fz/FK replay"
            git push origin HEAD:research/pupper-cpu-no-training-20261107
          fi
      - name: Archive replay and original physics trace
        uses: actions/upload-artifact@v4
        with:
          name: Stanford-Pupper-v3-CPU-5s-recorded-physics
          path: |
            research/stanford_pupper/viewer_data/pupper-stand-replay-v1.json
            research/stanford_pupper/upstream/pupper_v3.xml
          retention-days: 30
          if-no-files-found: error
