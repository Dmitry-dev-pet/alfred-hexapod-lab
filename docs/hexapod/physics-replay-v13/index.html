<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101923"><title>Hexapod Lab · физика MuJoCo V12</title>
<link rel="stylesheet" href="/hexapod/player-shell.css"><link rel="stylesheet" href="/hexapod/physics-replay-v13/replay.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body><main class="layout"><section class="stage">
<div id="viewer" role="img" aria-label="Фактические динамические положения 3D CAD30 робота из MuJoCo mj_step"></div>
<div id="replay-status" class="replay-status" role="status">Загрузка 3D CAD и кадров MuJoCo…</div>
<div class="replay-hud"><div class="replay-chip">MUJOCO · ФИЗИКА V12 <span id="model-note">ЗАПИСЬ, НЕ ОНЛАЙН</span></div><div id="contact-line">Опоры: —/6</div><div id="motion-line">Положение: —</div><div id="slip-line">Скорость контакта: —</div><div class="replay-legend">● зелёные лапы — реальная нагрузка Fz</div></div>
<div class="replay-console" aria-label="Управление физическим воспроизведением">
<div class="replay-selects">
<label>Условия<select id="variant" aria-label="Параметры физического эксперимента"><option value="nominal_full">Номинальные · 1,80 кг</option><option value="upper_mass_full">Масса · 2,08 кг</option><option value="friction_035_full">Трение · 0,35</option><option value="torque_035_full">Приводы · 0,35 Н·м</option></select></label>
<label>Эксперимент<select id="experiment" aria-label="Физический эксперимент"></select></label>
</div>
<div class="replay-actions"><button type="button" id="toggle" aria-label="Воспроизвести или приостановить">▶ Смотреть</button><input type="range" id="timeline" min="0" max="1" step="0.002" value="0" aria-label="Перемотка физического прогона"><output id="clock">0:00 / 0:00</output><select id="pace" aria-label="Скорость воспроизведения"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button type="button" id="reset-camera" aria-label="Вернуть камеру">Камера</button></div>
<div id="experiment-info" class="replay-footnote">Показаны реальные интегрированные состояния, не команды джойстиков · CAD30 · 500 Гц → запись 50 кадров/с</div>
</div>
<div id="error" role="alert" hidden></div>
</section><section class="controls" hidden><button id="play">▶</button><input id="seek" type="range" min="0" max="1"><select id="speed"><option value="1">1×</option></select></section></main>
<script>
window.addEventListener('error',function(e){const n=document.getElementById('replay-status');if(n&&!n.hidden)n.textContent='Ошибка загрузки физического просмотра: '+(e.message||e.target?.src||'JavaScript');},true);
window.addEventListener('unhandledrejection',function(e){const n=document.getElementById('replay-status');if(n&&!n.hidden)n.textContent='Ошибка: '+(e.reason?.message||String(e.reason));});
</script><script type="module" src="/hexapod/physics-replay-v13/app.js"></script><script src="/hexapod/player-shell.js"></script>
</body></html>
